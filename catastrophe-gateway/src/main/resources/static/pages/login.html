<div class="max-w-md mx-auto fade-in">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <div class="text-center mb-6">
            <span class="text-5xl">🔐</span>
            <h2 class="text-2xl font-bold text-gray-900 mt-3">Iniciar sesión</h2>
            <p class="text-gray-500 text-sm mt-1">Tu gato te espera al otro lado</p>
        </div>

        <form id="login-form" onsubmit="return handleLogin(event)">
            <div class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                    <input type="text" id="username" name="username" required
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cat-500 focus:border-cat-500 outline-none transition"
                           placeholder="gatero99">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input type="password" id="password" name="password" required
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cat-500 focus:border-cat-500 outline-none transition"
                           placeholder="••••••••">
                </div>
            </div>

            <div id="login-error" class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700"></div>

            <button type="submit" id="login-btn"
                    class="w-full mt-6 bg-cat-600 text-white py-2.5 rounded-lg font-medium hover:bg-cat-700 transition">
                Entrar 🐾
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            ¿No tienes cuenta?
            <a href="#" onclick="App.showRegister()" class="text-cat-600 hover:text-cat-700 font-medium">Regístrate</a>
        </p>
    </div>
</div>

<script>
async function handleLogin(e) {
    e.preventDefault();
    const form = e.target;
    const btn = document.getElementById('login-btn');
    const errorDiv = document.getElementById('login-error');
    errorDiv.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = 'Entrando... ⏳';

    try {
        const res = await fetch('/api/v1/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: form.username.value,
                password: form.password.value
            })
        });

        if (res.ok) {
            await App.checkSession();
            App.refreshNav();
            App.showDashboard();
            App.toast('¡Bienvenido de vuelta! Tu gato te estaba esperando. 🐱');
        } else if (res.status === 401) {
            errorDiv.textContent = '❌ Usuario o contraseña incorrectos.';
            errorDiv.classList.remove('hidden');
        } else {
            errorDiv.textContent = '❌ Error inesperado. Inténtalo de nuevo.';
            errorDiv.classList.remove('hidden');
        }
    } catch (err) {
        errorDiv.textContent = '❌ No se pudo conectar con el servidor.';
        errorDiv.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar 🐾';
    }
}
</script>
