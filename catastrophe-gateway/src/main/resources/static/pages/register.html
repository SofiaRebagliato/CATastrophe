<div class="max-w-md mx-auto fade-in">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <div class="text-center mb-6">
            <span class="text-5xl">🐾</span>
            <h2 class="text-2xl font-bold text-gray-900 mt-3">Crear cuenta</h2>
            <p class="text-gray-500 text-sm mt-1">Únete como asistente oficial de gatos</p>
        </div>

        <form id="register-form" onsubmit="return handleRegister(event)">
            <div class="space-y-4">
                <div>
                    <label for="reg-username" class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                    <input type="text" id="reg-username" name="username" required minlength="3" maxlength="50"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cat-500 focus:border-cat-500 outline-none transition"
                           placeholder="gatero99">
                </div>
                <div>
                    <label for="reg-email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="reg-email" name="email" required
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cat-500 focus:border-cat-500 outline-none transition"
                           placeholder="gatero@mail.com">
                </div>
                <div>
                    <label for="reg-displayName" class="block text-sm font-medium text-gray-700 mb-1">Nombre público</label>
                    <input type="text" id="reg-displayName" name="displayName" required
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cat-500 focus:border-cat-500 outline-none transition"
                           placeholder="El Gatero Supremo">
                </div>
                <div>
                    <label for="reg-password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input type="password" id="reg-password" name="password" required minlength="6"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cat-500 focus:border-cat-500 outline-none transition"
                           placeholder="••••••••">
                </div>
            </div>

            <div id="register-error" class="hidden mt-4 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700"></div>
            <div id="register-success" class="hidden mt-4 p-3 bg-green-50 border border-green-200 rounded-lg text-sm text-green-700"></div>

            <button type="submit" id="register-btn"
                    class="w-full mt-6 bg-cat-600 text-white py-2.5 rounded-lg font-medium hover:bg-cat-700 transition">
                Registrarse 🐱
            </button>
        </form>

        <p class="text-center text-sm text-gray-500 mt-6">
            ¿Ya tienes cuenta?
            <a href="#" onclick="App.showLogin()" class="text-cat-600 hover:text-cat-700 font-medium">Inicia sesión</a>
        </p>
    </div>
</div>

<script>
async function handleRegister(e) {
    e.preventDefault();
    const form = e.target;
    const btn = document.getElementById('register-btn');
    const errorDiv = document.getElementById('register-error');
    const successDiv = document.getElementById('register-success');
    errorDiv.classList.add('hidden');
    successDiv.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = 'Registrando... ⏳';

    try {
        const res = await fetch('/api/v1/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                username: document.getElementById('reg-username').value,
                email: document.getElementById('reg-email').value,
                displayName: document.getElementById('reg-displayName').value,
                password: document.getElementById('reg-password').value
            })
        });

        if (res.ok || res.status === 201) {
            successDiv.textContent = '✅ ¡Registro exitoso! Redirigiendo al login...';
            successDiv.classList.remove('hidden');
            setTimeout(() => App.showLogin(), 1500);
            App.toast('¡Registro exitoso! Ahora inicia sesión. 🐱', 'success');
        } else if (res.status === 409) {
            errorDiv.textContent = '❌ El nombre de usuario ya está en uso.';
            errorDiv.classList.remove('hidden');
        } else if (res.status === 400) {
            const data = await res.json().catch(() => null);
            errorDiv.textContent = '❌ ' + (data?.message || 'Datos inválidos. Revisa el formulario.');
            errorDiv.classList.remove('hidden');
        } else {
            errorDiv.textContent = '❌ Error inesperado. Inténtalo de nuevo.';
            errorDiv.classList.remove('hidden');
        }
    } catch (err) {
        errorDiv.textContent = '❌ No se pudo conectar con el servidor.';
        errorDiv.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Registrarse 🐱';
    }
}
</script>
