<div class="fade-in max-w-2xl mx-auto">
    <button onclick="App.showDashboard()" class="text-sm text-gray-500 hover:text-cat-600 mb-4">← Panel</button>
    <div id="cat-profile-content">
        <div class="text-center py-8 text-gray-400">Cargando perfil... 🐱</div>
    </div>
</div>

<script>
async function loadCatProfile(catId) {
    const id = catId || window._catProfileId;
    if (!id) { App.showDashboard(); return; }
    const container = document.getElementById('cat-profile-content');

    try {
        const [catRes, followCountRes] = await Promise.all([
            fetch(`/api/v1/cats/${id}`),
            fetch(`/api/v1/follows/count/${id}`)
        ]);

        if (!catRes.ok) { container.innerHTML = '<p class="text-red-500">Gato no encontrado.</p>'; return; }
        const cat = await catRes.json();
        const counts = followCountRes.ok ? await followCountRes.json() : { followers: 0, following: 0 };

        // Check follow status
        let isFollowing = false;
        if (App.activeCat && App.activeCat.id !== id) {
            const statusRes = await fetch(`/api/v1/follows/status/${id}`, { headers: App.getCatHeaders() });
            if (statusRes.ok) isFollowing = (await statusRes.json()).following;
        }

        const isOwn = App.activeCat && App.activeCat.id === id;

        container.innerHTML = `
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6">
                <div class="flex items-start justify-between">
                    <div class="flex items-center space-x-4">
                        ${cat.avatarUrl ? `<img src="${cat.avatarUrl}" class="w-16 h-16 rounded-full object-cover">` : '<span class="text-5xl">🐱</span>'}
                        <div>
                            <h2 class="text-xl font-bold text-gray-900">${cat.name}</h2>
                            <p class="text-sm text-gray-500">${cat.breed || 'Sin raza'} · ${cat.ageMonths ? cat.ageMonths + ' meses' : ''}</p>
                            <div class="flex space-x-3 mt-1 text-xs text-gray-500">
                                <span><strong>${counts.followers}</strong> seguidores</span>
                                <span><strong>${counts.following}</strong> seguidos</span>
                            </div>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="inline-block bg-cat-100 text-cat-700 px-3 py-1 rounded-full text-sm font-medium">
                            Lv.${cat.level || 0} · ${cat.xp || 0} XP
                        </span>
                        ${!isOwn && App.activeCat ? `
                            <div class="mt-2 space-x-2">
                                <button onclick="toggleFollow('${id}')" id="follow-btn"
                                    class="text-xs px-3 py-1 rounded-lg ${isFollowing ? 'bg-gray-200 text-gray-700' : 'bg-cat-600 text-white'} hover:opacity-80 transition">
                                    ${isFollowing ? 'Dejar de seguir' : 'Seguir'}
                                </button>
                                <button onclick="App.showConversation('${id}')" class="text-xs px-3 py-1 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">
                                    💬 Mensaje
                                </button>
                            </div>
                        ` : ''}
                        ${isOwn ? `<button onclick="refreshAvatar('${id}')" class="mt-2 text-xs px-3 py-1 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">🔄 Nuevo avatar</button>` : ''}
                    </div>
                </div>
                ${cat.bio ? `<p class="text-gray-600 mt-4 text-sm">${cat.bio}</p>` : ''}
            </div>

            <h3 class="text-lg font-semibold text-gray-800 mb-3">📰 Meows</h3>
            <div id="cat-posts">Cargando...</div>
        `;

        // Load posts
        const postsRes = await fetch(`/api/v1/posts/cat/${id}?page=0&size=20`);
        const postsContainer = document.getElementById('cat-posts');
        if (postsRes.ok) {
            const posts = await postsRes.json();
            postsContainer.innerHTML = posts.map(p => `
                <div class="bg-white rounded-xl border border-gray-100 p-4 mb-3">
                    <p class="text-gray-700">${p.content}</p>
                    ${p.imageUrl ? `<img src="${p.imageUrl}" class="mt-2 rounded-lg max-h-48 object-cover">` : ''}
                    <div class="text-xs text-gray-400 mt-2">❤️ ${p.likeCount || 0} · 💬 ${p.commentCount || 0} · ${App.timeAgo(p.createdAt)}</div>
                </div>
            `).join('') || '<p class="text-gray-500 text-sm">No hay meows aún.</p>';
        }
    } catch (err) {
        container.innerHTML = '<p class="text-red-500">Error al cargar el perfil.</p>';
    }
}

async function toggleFollow(catId) {
    if (!App.requireCat()) return;
    const btn = document.getElementById('follow-btn');
    const isFollowing = btn.textContent.trim() === 'Dejar de seguir';
    try {
        const res = await fetch(`/api/v1/follows/${catId}`, {
            method: isFollowing ? 'DELETE' : 'POST',
            headers: App.getCatHeaders()
        });
        if (res.ok || res.status === 201 || res.status === 204) {
            btn.textContent = isFollowing ? 'Seguir' : 'Dejar de seguir';
            btn.className = `text-xs px-3 py-1 rounded-lg ${!isFollowing ? 'bg-gray-200 text-gray-700' : 'bg-cat-600 text-white'} hover:opacity-80 transition`;
            App.toast(isFollowing ? 'Has dejado de seguir 😿' : '¡Ahora lo sigues! 🐾');
        }
    } catch (err) { App.toast('Error.', 'error'); }
}

async function refreshAvatar(catId) {
    try {
        const res = await fetch(`/api/v1/cats/${catId}/refresh-avatar`, { method: 'POST' });
        if (res.ok) {
            App.toast('¡Avatar actualizado! 📸');
            loadCatProfile(catId);
        }
    } catch (err) { App.toast('Error al actualizar avatar.', 'error'); }
}

loadCatProfile(window._catProfileId);
</script>
