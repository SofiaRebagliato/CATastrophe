<div class="fade-in max-w-2xl mx-auto">
    <button onclick="App.showDashboard()" class="text-sm text-gray-500 hover:text-cat-600 mb-4">← Panel</button>
    <div id="cat-profile-content">
        <div class="text-center py-8 text-gray-400">Cargando perfil... 🐱</div>
    </div>
</div>

<script>
async function loadCatProfile(catId) {
    const id = catId || window._catProfileId;
    if (!id) { App.showDashboard(); return; }
    const container = document.getElementById('cat-profile-content');

    try {
        const [catRes, followCountRes] = await Promise.all([
            fetch(`/api/v1/cats/${id}`),
            fetch(`/api/v1/follows/count/${id}`)
        ]);

        if (!catRes.ok) { container.innerHTML = '<p class="text-red-500">Gato no encontrado.</p>'; return; }
        const cat = await catRes.json();
        const counts = followCountRes.ok ? await followCountRes.json() : { followers: 0, following: 0 };

        // Check follow status
        let isFollowing = false;
        if (App.activeCat && App.activeCat.id !== id) {
            const statusRes = await fetch(`/api/v1/follows/status/${id}`, { headers: App.getCatHeaders() });
            if (statusRes.ok) isFollowing = (await statusRes.json()).following;
        }

        const isOwn = App.activeCat && App.activeCat.id === id;

        container.innerHTML = `
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6">
                <div class="flex items-start justify-between">
                    <div class="flex items-center space-x-4">
                        ${cat.avatarUrl ? `<img src="${cat.avatarUrl}" class="w-16 h-16 rounded-full object-cover" onerror="this.outerHTML='<span class=\\'text-5xl\\'>🐱</span>'">` : '<span class="text-5xl">🐱</span>'}
                        <div>
                            <h2 class="text-xl font-bold text-gray-900">${cat.name} ${cat.isBirthday ? '🎂 ¡Feliz cumpleaños!' : ''}</h2>
                            <p class="text-sm text-gray-500">${cat.breed || 'Sin raza'} · ${cat.ageDisplay || ''}</p>
                            <div class="flex space-x-3 mt-1 text-xs text-gray-500">
                                <span><strong>${counts.followers}</strong> seguidores</span>
                                <span><strong>${counts.following}</strong> seguidos</span>
                            </div>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="inline-block bg-cat-100 text-cat-700 px-3 py-1 rounded-full text-sm font-medium">
                            Lv.${cat.level || 0} · ${cat.xp || 0} XP
                        </span>
                        ${!isOwn && App.activeCat ? `
                            <div class="mt-2 space-x-2">
                                <button onclick="toggleFollow('${id}')" id="follow-btn"
                                    class="text-xs px-3 py-1 rounded-lg ${isFollowing ? 'bg-gray-200 text-gray-700' : 'bg-cat-600 text-white'} hover:opacity-80 transition">
                                    ${isFollowing ? 'Dejar de seguir' : 'Seguir'}
                                </button>
                                <button onclick="App.showConversation('${id}')" class="text-xs px-3 py-1 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">
                                    💬 Mensaje
                                </button>
                            </div>
                        ` : ''}
                        ${isOwn ? `
                            <div class="mt-2 space-x-1">
                                <button onclick="refreshAvatar('${id}')" class="text-xs px-3 py-1 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">🔄 Avatar</button>
                                <button onclick="toggleEditCat()" class="text-xs px-3 py-1 rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">✏️ Editar</button>
                            </div>
                        ` : ''}
                    </div>
                </div>
                ${cat.bio ? `<p id="cat-bio-text" class="text-gray-600 mt-4 text-sm">${cat.bio}</p>` : ''}

                ${isOwn ? `
                <form id="edit-cat-form" onsubmit="return submitEditCat(event, '${id}')" class="hidden mt-4 pt-4 border-t border-gray-100 space-y-3">
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Nombre</label>
                        <input type="text" id="edit-cat-name" value="${(cat.name || '').replace(/"/g, '&quot;')}" maxlength="100" required
                               class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-cat-300">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Raza</label>
                            <input type="text" id="edit-cat-breed" value="${(cat.breed || '').replace(/"/g, '&quot;')}" maxlength="100"
                                   class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-cat-300">
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-600 mb-1">Fecha de nacimiento</label>
                            <input type="date" id="edit-cat-birthdate" value="${cat.birthDate || ''}"
                                   class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-cat-300">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-600 mb-1">Bio</label>
                        <textarea id="edit-cat-bio" rows="2" maxlength="500"
                                  class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-cat-300">${cat.bio || ''}</textarea>
                    </div>
                    <div id="edit-cat-error" class="hidden p-2 bg-red-50 border border-red-200 rounded-lg text-xs text-red-700"></div>
                    <div class="flex items-center justify-between pt-2 border-t border-gray-100">
                        <div class="flex space-x-2">
                            <button type="submit" id="edit-cat-btn" class="text-sm bg-cat-600 text-white px-4 py-1.5 rounded-lg hover:bg-cat-700 transition">Guardar cambios</button>
                            <button type="button" onclick="toggleEditCat()" class="text-sm bg-gray-100 text-gray-600 px-4 py-1.5 rounded-lg hover:bg-gray-200 transition">Cancelar</button>
                        </div>
                        <button type="button" onclick="deleteCat('${id}')" class="text-xs text-red-500 hover:text-red-700 transition">🗑️ Eliminar perfil</button>
                    </div>
                </form>
                ` : ''}
            </div>

            <h3 class="text-lg font-semibold text-gray-800 mb-3">📰 Meows</h3>
            <div id="cat-posts">Cargando...</div>
        `;

        // Load posts
        const postsRes = await fetch(`/api/v1/posts/cat/${id}?page=0&size=20`);
        const postsContainer = document.getElementById('cat-posts');
        if (!postsRes.ok) {
            const data = await postsRes.json().catch(() => null);
            postsContainer.innerHTML = `<p class="text-red-500 text-sm">No se pudieron cargar los meows (${postsRes.status}). ${data?.message || ''}</p>`;
        } else {
            const posts = await postsRes.json();
            if (posts.length === 0) {
                postsContainer.innerHTML = '<p class="text-gray-500 text-sm">No hay meows aún.</p>';
            } else {
                // Resolve cat names for comments
                await App.resolveCatNames([id]);
                postsContainer.innerHTML = posts.map(p => `
                    <div class="bg-white rounded-xl border border-gray-100 p-4 mb-3">
                        <p class="text-gray-700">${p.content}</p>
                        ${p.imageUrl ? `<img src="${p.imageUrl}" class="mt-2 rounded-lg max-h-48 object-cover">` : ''}
                        <div class="flex items-center space-x-4 mt-2 text-xs text-gray-400">
                            <button onclick="toggleLikeProfile('${p.id}')" class="flex items-center space-x-1 hover:text-red-500 transition">
                                <span>❤️</span><span id="like-count-${p.id}">${p.likeCount || 0}</span>
                            </button>
                            <button onclick="toggleCommentsProfile('${p.id}')" class="flex items-center space-x-1 hover:text-cat-600 transition">
                                <span>💬</span><span>${p.commentCount || 0}</span>
                            </button>
                            <span>${App.timeAgo(p.createdAt)}</span>
                        </div>
                        <div id="comments-${p.id}" class="hidden mt-3 pt-2 border-t border-gray-50">
                            <div id="comments-list-${p.id}"></div>
                            <form onsubmit="return addCommentProfile(event, '${p.id}')" class="flex space-x-2 mt-2">
                                <input type="text" placeholder="Comentar..." required
                                       class="flex-1 text-sm px-3 py-1.5 border border-gray-200 rounded-lg outline-none focus:ring-1 focus:ring-cat-300">
                                <button type="submit" class="text-sm bg-cat-100 text-cat-700 px-3 py-1.5 rounded-lg hover:bg-cat-200">Enviar</button>
                            </form>
                        </div>
                    </div>
                `).join('');
            }
        }
    } catch (err) {
        container.innerHTML = '<p class="text-red-500">Error al cargar el perfil.</p>';
    }
}

async function toggleFollow(catId) {
    if (!App.requireCat()) return;
    const btn = document.getElementById('follow-btn');
    const isFollowing = btn.textContent.trim() === 'Dejar de seguir';
    try {
        const res = await fetch(`/api/v1/follows/${catId}`, {
            method: isFollowing ? 'DELETE' : 'POST',
            headers: App.getCatHeaders()
        });
        if (res.ok || res.status === 201 || res.status === 204) {
            btn.textContent = isFollowing ? 'Seguir' : 'Dejar de seguir';
            btn.className = `text-xs px-3 py-1 rounded-lg ${!isFollowing ? 'bg-gray-200 text-gray-700' : 'bg-cat-600 text-white'} hover:opacity-80 transition`;
            App.toast(isFollowing ? 'Has dejado de seguir 😿' : '¡Ahora lo sigues! 🐾');
        }
    } catch (err) { App.toast('Error.', 'error'); }
}

async function refreshAvatar(catId) {
    try {
        const res = await fetch(`/api/v1/cats/${catId}/refresh-avatar`, { method: 'POST' });
        if (res.ok) {
            App.toast('¡Avatar actualizado! 📸');
            loadCatProfile(catId);
        } else {
            App.toast('Error al actualizar avatar.', 'error');
        }
    } catch (err) { App.toast('Error al actualizar avatar.', 'error'); }
}

function toggleEditCat() {
    const form = document.getElementById('edit-cat-form');
    if (form) form.classList.toggle('hidden');
}

async function submitEditCat(e, catId) {
    e.preventDefault();
    const btn = document.getElementById('edit-cat-btn');
    const errorDiv = document.getElementById('edit-cat-error');
    errorDiv.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = 'Guardando... ⏳';

    try {
        const body = { name: document.getElementById('edit-cat-name').value };
        const breed = document.getElementById('edit-cat-breed').value;
        const birthDate = document.getElementById('edit-cat-birthdate').value;
        const bio = document.getElementById('edit-cat-bio').value;
        // Campos opcionales: solo se envían si tienen valor (null = mantener el actual en backend)
        body.breed = breed || null;
        body.birthDate = birthDate || null;
        body.bio = bio || null;

        const res = await fetch(`/api/v1/cats/${catId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (res.ok) {
            // Si era el gato activo, refrescamos su copia en memoria (nombre en la nav, etc.)
            if (App.activeCat && App.activeCat.id === catId) {
                App.activeCat = await res.json();
                localStorage.setItem('activeCatId', App.activeCat.id);
                App.refreshNav();
            }
            App.toast('¡Perfil actualizado! 🐱');
            loadCatProfile(catId);
        } else if (res.status === 401) {
            App.showLogin();
            App.toast('Tu sesión ha expirado.', 'error');
        } else {
            const data = await res.json().catch(() => null);
            errorDiv.textContent = '❌ ' + (data?.message || 'No se pudo actualizar el gato.');
            errorDiv.classList.remove('hidden');
        }
    } catch (err) {
        errorDiv.textContent = '❌ Error al actualizar el gato.';
        errorDiv.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Guardar cambios';
    }
}

async function deleteCat(catId) {
    if (!window.confirm('¿Seguro que quieres eliminar este gato? Esta acción es permanente y se borrarán su perfil y su progreso.')) return;
    try {
        const res = await fetch(`/api/v1/cats/${catId}`, { method: 'DELETE' });
        if (res.ok || res.status === 204) {
            App.clearActiveCatIfDeleted(catId);
            App.toast('Gato eliminado. 😿');
            App.showDashboard();
        } else if (res.status === 401) {
            App.showLogin();
            App.toast('Tu sesión ha expirado.', 'error');
        } else {
            const data = await res.json().catch(() => null);
            App.toast(data?.message || 'No se pudo eliminar el gato.', 'error');
        }
    } catch (err) {
        App.toast('Error al eliminar el gato.', 'error');
    }
}

async function toggleLikeProfile(postId) {
    if (!App.requireCat()) return;
    try {
        const statusRes = await fetch(`/api/v1/likes/post/${postId}/status`, { headers: App.getCatHeaders() });
        if (!statusRes.ok) return;
        const status = await statusRes.json();
        const method = status.liked ? 'DELETE' : 'POST';
        const res = await fetch(`/api/v1/likes/post/${postId}`, { method, headers: App.getCatHeaders() });
        if (res.ok) {
            const data = await res.json();
            document.getElementById(`like-count-${postId}`).textContent = data.likeCount;
        } else {
            const err = await res.json().catch(() => null);
            App.toast(err?.message || 'No se pudo dar like.', 'error');
        }
    } catch (err) { App.toast('Error al dar like.', 'error'); }
}

async function toggleCommentsProfile(postId) {
    const section = document.getElementById(`comments-${postId}`);
    section.classList.toggle('hidden');
    if (!section.classList.contains('hidden')) {
        loadCommentsProfile(postId);
    }
}

async function loadCommentsProfile(postId) {
    const container = document.getElementById(`comments-list-${postId}`);
    try {
        const res = await fetch(`/api/v1/comments/post/${postId}?page=0&size=20`, { headers: App.getCatHeaders() });
        if (res.ok) {
            const comments = await res.json();
            await App.resolveCatNames(comments.map(c => c.catId));
            container.innerHTML = comments.map(c => {
                const isMine = App.activeCat && c.catId === App.activeCat.id;
                const withinWindow = isMine && (Date.now() - new Date(c.createdAt).getTime() < 5 * 60 * 1000);
                return `<div class="text-sm py-1.5 flex items-start justify-between group">
                    <div>
                        <span class="font-medium text-gray-700 cursor-pointer" onclick="App.showCatProfile('${c.catId}')">${App.getCatName(c.catId)}</span>
                        <span class="text-gray-600"> ${c.content}</span>
                        <span class="text-xs text-gray-400 ml-1">${App.timeAgo(c.createdAt)}</span>
                    </div>
                    ${withinWindow ? `<button onclick="deleteCommentProfile('${c.id}','${postId}')" class="hidden group-hover:block text-xs text-red-400 hover:text-red-600 ml-2 flex-shrink-0" title="Eliminar">✕</button>` : ''}
                </div>`;
            }).join('') || '<p class="text-xs text-gray-400">Sin comentarios aún.</p>';
        }
    } catch (err) { /* ignore */ }
}

async function deleteCommentProfile(commentId, postId) {
    if (!App.requireCat()) return;
    try {
        var res = await fetch('/api/v1/comments/' + commentId, {
            method: 'DELETE', headers: App.getCatHeaders()
        });
        if (res.ok || res.status === 204) {
            App.toast('Comentario eliminado.');
            loadCommentsProfile(postId);
        } else { App.toast('No se pudo eliminar el comentario.', 'error'); }
    } catch (err) { App.toast('Error.', 'error'); }
}

async function addCommentProfile(e, postId) {
    e.preventDefault();
    if (!App.requireCat()) return;
    const input = e.target.querySelector('input');
    try {
        const res = await fetch('/api/v1/comments', {
            method: 'POST',
            headers: App.getHeaders(),
            body: JSON.stringify({ postId, content: input.value })
        });
        if (res.ok || res.status === 201) {
            input.value = '';
            loadCommentsProfile(postId);
            App.toast('Comentario añadido 💬');
        } else {
            const err = await res.json().catch(() => null);
            App.toast(err?.message || 'No se pudo comentar.', 'error');
        }
    } catch (err) { App.toast('Error al comentar.', 'error'); }
}

loadCatProfile(window._catProfileId);
</script>
