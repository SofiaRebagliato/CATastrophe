<div class="fade-in max-w-4xl mx-auto">
    <div class="relative flex items-center justify-center mb-6">
        <h2 class="text-2xl font-bold text-gray-900 text-center">🗺️ Aventuras</h2>
        <button onclick="App.showDashboard()" class="absolute right-0 text-sm text-gray-500 hover:text-cat-600">← Panel</button>
    </div>

    <!-- Aventuras activas -->
    <section class="mb-8">
        <h3 class="text-lg font-semibold text-gray-800 mb-3">🎯 Aventuras activas</h3>
        <div id="active-adventures">
            <div class="text-center py-4 text-gray-400">Cargando...</div>
        </div>
    </section>

    <!-- Catálogo de aventuras -->
    <section class="mb-8">
        <h3 class="text-lg font-semibold text-gray-800 mb-3">📋 Catálogo de aventuras</h3>
        <div class="flex space-x-2 mb-4" id="filter-buttons">
            <button onclick="setFilter(this, null)"          class="filter-btn active text-xs px-3 py-1 rounded-lg bg-cat-600 text-white">Todas</button>
            <button onclick="setFilter(this, 'EXPLORATION')" class="filter-btn text-xs px-3 py-1 rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200">Exploración</button>
            <button onclick="setFilter(this, 'HUNTING')"     class="filter-btn text-xs px-3 py-1 rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200">Caza</button>
            <button onclick="setFilter(this, 'SOCIAL')"      class="filter-btn text-xs px-3 py-1 rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200">Social</button>
        </div>
        <div id="adventure-catalog">
            <div class="text-center py-4 text-gray-400">Cargando catálogo...</div>
        </div>
    </section>

    <!-- Historial -->
    <section>
        <h3 class="text-lg font-semibold text-gray-800 mb-3">📜 Historial</h3>
        <div id="adventure-history">
            <div class="text-center py-4 text-gray-400">Cargando...</div>
        </div>
    </section>
</div>

<script>
// Catálogo en caché para hacer join en cliente (igual que badges)
var _adventureCatalog = null;
async function getAdventureCatalog() {
    if (_adventureCatalog) return _adventureCatalog;
    var res = await fetch('/api/v1/adventures');
    _adventureCatalog = res.ok ? await res.json() : [];
    return _adventureCatalog;
}

var _statusLabels = {
    IN_PROGRESS: { text: '🎯 En progreso', cls: 'bg-yellow-100 text-yellow-700' },
    COMPLETED:   { text: '✅ Completada',  cls: 'bg-green-100 text-green-700'  },
    ABANDONED:   { text: '😿 Abandonada',  cls: 'bg-gray-100 text-gray-500'    }
};
function statusTag(status) {
    var s = _statusLabels[status] || { text: status, cls: 'bg-gray-100 text-gray-600' };
    return `<span class="text-xs px-2 py-0.5 rounded ${s.cls}">${s.text}</span>`;
}

async function loadActiveAdventures() {
    if (!App.activeCat) return;
    var container = document.getElementById('active-adventures');
    var catalog = await getAdventureCatalog();
    var catMap = {};
    catalog.forEach(function(a) { catMap[a.id] = a; });
    try {
        var res = await fetch('/api/v1/adventures/active', { headers: App.getCatHeaders() });
        if (res.ok) {
            var adventures = await res.json();
            if (adventures.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-500">No tienes aventuras activas. ¡Inicia una!</p>';
                return;
            }
            container.innerHTML = '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">' + adventures.map(function(a) {
                var title = (catMap[a.adventureId] || {}).title || 'Aventura';
                return `<div class="bg-white rounded-xl border border-gray-100 p-4">
                    <div class="flex justify-between items-center mb-2">
                        <span class="font-medium text-gray-800 text-sm">${title}</span>
                        ${statusTag(a.status)}
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-2 mb-2">
                        <div class="bg-cat-500 h-2 rounded-full" style="width: ${a.progressPct || 0}%"></div>
                    </div>
                    <div class="flex space-x-2">
                        <button onclick="updateProgress('${a.id}')" class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded">+25% Progreso</button>
                        <button onclick="completeAdventure('${a.id}')" class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded">Completar ✓</button>
                        <button onclick="abandonAdventure('${a.id}')" class="text-xs bg-red-100 text-red-700 px-2 py-1 rounded">Abandonar</button>
                    </div>
                </div>`;
            }).join('') + '</div>';
        }
    } catch (err) { container.innerHTML = '<p class="text-red-500 text-sm">Error.</p>'; }
}

function setFilter(btn, type) {
    document.querySelectorAll('.filter-btn').forEach(function(b) {
        b.className = 'filter-btn text-xs px-3 py-1 rounded-lg bg-gray-100 text-gray-600 hover:bg-gray-200';
    });
    btn.className = 'filter-btn active text-xs px-3 py-1 rounded-lg bg-cat-600 text-white';
    loadCatalog(type);
}

async function loadCatalog(type) {
    var container = document.getElementById('adventure-catalog');
    var url = type ? `/api/v1/adventures?type=${type}` : '/api/v1/adventures';
    try {
        var res = await fetch(url);
        if (res.ok) {
            var adventures = await res.json();
            // Update cache
            if (!type) _adventureCatalog = adventures;
            if (adventures.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-500">No hay aventuras disponibles.</p>';
                return;
            }
            container.innerHTML = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">' + adventures.map(function(a) {
                return `<div class="bg-white rounded-xl border border-gray-100 p-4">
                    <h4 class="font-semibold text-gray-800 text-sm">${a.title}</h4>
                    <p class="text-xs text-gray-500 mt-1">${a.description || ''}</p>
                    <div class="flex justify-between items-center mt-3">
                        <span class="text-xs text-gray-500">⭐ ${a.difficulty || '?'} · 🎯 ${a.xpReward} XP</span>
                        <button onclick="startAdventure('${a.id}')" class="text-xs bg-cat-600 text-white px-3 py-1 rounded-lg hover:bg-cat-700">Iniciar</button>
                    </div>
                </div>`;
            }).join('') + '</div>';
        }
    } catch (err) { container.innerHTML = '<p class="text-red-500 text-sm">Error al cargar catálogo.</p>'; }
}

async function loadHistory() {
    if (!App.activeCat) return;
    var container = document.getElementById('adventure-history');
    var catalog = await getAdventureCatalog();
    var catMap = {};
    catalog.forEach(function(a) { catMap[a.id] = a; });
    try {
        var res = await fetch('/api/v1/adventures/history?page=0&size=10', { headers: App.getCatHeaders() });
        if (res.ok) {
            var history = await res.json();
            if (history.length === 0) { container.innerHTML = '<p class="text-sm text-gray-500">Sin historial.</p>'; return; }
            container.innerHTML = history.map(function(a) {
                var title = (catMap[a.adventureId] || {}).title || 'Aventura';
                return `<div class="flex justify-between items-center bg-white rounded-lg border border-gray-100 p-3 mb-2">
                    <span class="text-sm text-gray-700">${title}</span>
                    ${statusTag(a.status)}
                </div>`;
            }).join('');
        }
    } catch (err) { container.innerHTML = '<p class="text-red-500 text-sm">Error.</p>'; }
}

async function startAdventure(adventureId) {
    if (!App.requireCat()) return;
    try {
        var res = await fetch('/api/v1/adventures/start', {
            method: 'POST', headers: App.getHeaders(),
            body: JSON.stringify({ adventureId })
        });
        if (res.ok || res.status === 201) {
            App.toast('¡Aventura iniciada! 🗺️');
            loadActiveAdventures();
        } else { App.toast('No se pudo iniciar la aventura.', 'error'); }
    } catch (err) { App.toast('Error.', 'error'); }
}

async function updateProgress(catAdventureId) {
    try {
        var res = await fetch(`/api/v1/adventures/${catAdventureId}/progress`, {
            method: 'PATCH', headers: App.getHeaders(),
            body: JSON.stringify({ progressPct: 25 })
        });
        if (res.ok) { App.toast('Progreso actualizado 📈'); loadActiveAdventures(); }
    } catch (err) { App.toast('Error.', 'error'); }
}

async function completeAdventure(catAdventureId) {
    try {
        var res = await fetch(`/api/v1/adventures/${catAdventureId}/complete`, {
            method: 'POST', headers: App.getCatHeaders()
        });
        if (res.ok) { App.toast('¡Aventura completada! 🎉'); loadActiveAdventures(); loadHistory(); }
        else { App.toast('No se pudo completar.', 'error'); }
    } catch (err) { App.toast('Error.', 'error'); }
}

async function abandonAdventure(catAdventureId) {
    try {
        var res = await fetch(`/api/v1/adventures/${catAdventureId}/abandon`, {
            method: 'POST', headers: App.getCatHeaders()
        });
        if (res.ok) { App.toast('Aventura abandonada 😿'); loadActiveAdventures(); loadHistory(); }
    } catch (err) { App.toast('Error.', 'error'); }
}

loadActiveAdventures();
loadCatalog();
loadHistory();
</script>
