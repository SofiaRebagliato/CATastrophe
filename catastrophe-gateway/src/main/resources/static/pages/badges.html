<div class="fade-in max-w-5xl mx-auto">
    <div class="flex justify-between items-center mb-8">
        <div>
            <h2 class="text-3xl font-bold text-gray-900">🎖️ Insignias</h2>
            <p class="text-sm text-gray-500 mt-1">Colecciona logros completando aventuras y retos</p>
        </div>
        <button onclick="App.showDashboard()" class="text-sm text-gray-500 hover:text-cat-600 transition">← Panel</button>
    </div>

    <!-- Mis insignias -->
    <section class="mb-12">
        <div class="flex items-center space-x-2 mb-4">
            <h3 class="text-2xl font-bold text-gray-800">🏆 Mis Insignias</h3>
            <span id="badge-count" class="text-sm px-2 py-1 rounded-full bg-cat-100 text-cat-700 font-medium">0</span>
        </div>
        <div id="my-badges" class="bg-gradient-to-br from-gray-50 to-gray-100 rounded-2xl p-8 border border-gray-200">
            <div class="text-center py-8 text-gray-400">Cargando insignias...</div>
        </div>
    </section>

    <!-- Catálogo completo -->
    <section>
        <h3 class="text-2xl font-bold text-gray-800 mb-4">📚 Catálogo Completo</h3>
        <div id="all-badges" class="bg-gradient-to-br from-gray-50 to-gray-100 rounded-2xl p-8 border border-gray-200">
            <div class="text-center py-8 text-gray-400">Cargando catálogo...</div>
        </div>
    </section>
</div>

<script>
var rarityColors = {
    common: 'from-gray-100 to-gray-50 border-gray-200 text-gray-700',
    rare: 'from-blue-100 to-blue-50 border-blue-200 text-blue-700',
    epic: 'from-purple-100 to-purple-50 border-purple-200 text-purple-700',
    legendary: 'from-yellow-100 to-yellow-50 border-yellow-200 text-yellow-700'
};

var rarityBadges = {
    common: '⚪',
    rare: '🔵',
    epic: '💜',
    legendary: '⭐'
};

var rarityLabels = {
    common: 'Común',
    rare: 'Rara',
    epic: 'Épica',
    legendary: 'Legendaria'
};

async function loadMyBadges() {
    if (!App.activeCat) {
        document.getElementById('my-badges').innerHTML = '<p class="text-sm text-gray-500 text-center py-8">Activa un gato para ver tus insignias.</p>';
        return;
    }
    const container = document.getElementById('my-badges');
    try {
        const res = await fetch(`/api/v1/badges/cat/${App.activeCat.id}`);
        if (res.ok) {
            const badges = await res.json();
            document.getElementById('badge-count').textContent = badges.length;
            if (badges.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-500 text-center py-8">Aún no has desbloqueado insignias. ¡Completa aventuras y retos! 🚀</p>';
                return;
            }
            container.innerHTML = '<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">' + badges.map(b => `
                <div class="group">
                    <div class="bg-gradient-to-br ${rarityColors[b.rarity.toLowerCase()] || rarityColors.common} rounded-2xl border-2 p-4 text-center transition-all duration-200 hover:shadow-lg hover:scale-105 cursor-default">
                        <div class="text-4xl mb-2 inline-flex items-center justify-center w-full">
                            ${b.iconUrl && !b.iconUrl.startsWith('/') ? b.iconUrl : (b.iconUrl || '🎖️')}
                        </div>
                        <p class="text-xs font-semibold text-gray-800 line-clamp-2 mb-1">${b.name || 'Insignia'}</p>
                        <p class="text-xs text-gray-600 line-clamp-1">${App.timeAgo(b.earnedAt)}</p>
                    </div>
                </div>
            `).join('') + '</div>';
        } else {
            container.innerHTML = '<p class="text-red-500 text-sm text-center py-8">No se pudieron cargar tus insignias.</p>';
        }
    } catch (err) {
        container.innerHTML = '<p class="text-red-500 text-sm text-center py-8">Error al cargar insignias.</p>';
    }
}

async function loadAllBadges() {
    const container = document.getElementById('all-badges');
    try {
        const res = await fetch('/api/v1/badges');
        if (res.ok) {
            const badges = await res.json();
            if (badges.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-500 text-center py-8">No hay insignias definidas aún.</p>';
                return;
            }
            
            // Agrupar por rareza
            const grouped = {};
            badges.forEach(b => {
                const rarity = (b.rarity || 'common').toLowerCase();
                if (!grouped[rarity]) grouped[rarity] = [];
                grouped[rarity].push(b);
            });
            
            const rarityOrder = ['common', 'rare', 'epic', 'legendary'];
            let html = '';
            
            for (const rarity of rarityOrder) {
                if (!grouped[rarity]) continue;
                const items = grouped[rarity];
                html += `
                    <div class="mb-8">
                        <div class="flex items-center space-x-2 mb-4">
                            <span class="text-2xl">${rarityBadges[rarity]}</span>
                            <h4 class="text-lg font-bold text-gray-800">${rarityLabels[rarity]} (${items.length})</h4>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                            ${items.map(b => `
                                <div class="bg-gradient-to-br ${rarityColors[rarity]} rounded-xl border-2 p-4 transition-all duration-200 hover:shadow-md">
                                    <div class="flex items-start space-x-3">
                                        <div class="text-3xl flex-shrink-0">
                                            ${b.iconUrl && !b.iconUrl.startsWith('/') ? b.iconUrl : (b.iconUrl || '🎖️')}
                                        </div>
                                        <div class="flex-1 min-w-0">
                                            <h5 class="font-semibold text-sm text-gray-900 line-clamp-2">${b.name}</h5>
                                            <p class="text-xs text-gray-700 mt-1 line-clamp-2">${b.description || '(Sin descripción)'}</p>
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
        } else {
            container.innerHTML = '<p class="text-red-500 text-sm text-center py-8">No se pudieron cargar las insignias.</p>';
        }
    } catch (err) {
        container.innerHTML = '<p class="text-red-500 text-sm text-center py-8">Error al cargar el catálogo.</p>';
    }
}

loadMyBadges();
loadAllBadges();
</script>
