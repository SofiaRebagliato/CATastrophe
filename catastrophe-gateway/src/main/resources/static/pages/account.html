<div class="fade-in max-w-xl mx-auto">
    <button onclick="App.showDashboard()" class="text-sm text-gray-500 hover:text-cat-600 mb-4">← Panel</button>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6">
        <div class="flex items-center space-x-3 mb-5">
            <span class="text-4xl">🐾</span>
            <div>
                <h2 class="text-xl font-bold text-gray-900">Mi cuenta</h2>
                <p class="text-sm text-gray-500">Gestiona tu perfil de humano asistente</p>
            </div>
        </div>

        <form id="account-form" onsubmit="return submitAccount(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                <input type="text" id="account-username" disabled
                       class="w-full px-4 py-2.5 border border-gray-200 rounded-lg bg-gray-50 text-gray-500 outline-none">
                <p class="text-xs text-gray-400 mt-1">El nombre de usuario no se puede cambiar.</p>
            </div>
            <div>
                <label for="account-displayname" class="block text-sm font-medium text-gray-700 mb-1">Nombre visible</label>
                <input type="text" id="account-displayname" maxlength="100"
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-cat-500 focus:border-cat-500 transition">
            </div>
            <div>
                <label for="account-email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="account-email"
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-cat-500 focus:border-cat-500 transition">
            </div>

            <div id="account-error" class="hidden p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700"></div>

            <button type="submit" id="account-btn"
                    class="bg-cat-600 text-white px-5 py-2.5 rounded-lg font-medium hover:bg-cat-700 transition">
                Guardar cambios
            </button>
        </form>
    </div>

    <!-- Zona de peligro -->
    <div class="bg-white rounded-2xl shadow-sm border border-red-100 p-6">
        <h3 class="text-sm font-semibold text-red-600 mb-2">Zona de peligro</h3>
        <p class="text-sm text-gray-600 mb-4">
            Al desactivar tu cuenta no podrás volver a iniciar sesión. Tus gatos dejarán de estar accesibles.
        </p>
        <button onclick="deactivateAccount()"
                class="text-sm bg-red-50 text-red-600 px-4 py-2 rounded-lg hover:bg-red-100 transition border border-red-200">
            Desactivar mi cuenta
        </button>
    </div>
</div>

<script>
async function loadAccount() {
    // App.user se rellena al iniciar sesión; si no, lo recuperamos.
    if (!App.user) await App.checkSession();
    if (!App.user) { App.showLogin(); return; }

    document.getElementById('account-username').value = App.user.username || '';
    document.getElementById('account-displayname').value = App.user.displayName || '';
    document.getElementById('account-email').value = App.user.email || '';
}

async function submitAccount(e) {
    e.preventDefault();
    const btn = document.getElementById('account-btn');
    const errorDiv = document.getElementById('account-error');
    errorDiv.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = 'Guardando... ⏳';

    try {
        const body = {
            displayName: document.getElementById('account-displayname').value,
            email: document.getElementById('account-email').value
        };

        const res = await fetch(`/api/v1/humans/${App.user.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (res.ok) {
            const updated = await res.json();
            // Mantenemos sincronizada la copia en memoria y la barra de navegación.
            App.user.displayName = updated.displayName;
            App.user.email = updated.email;
            App.refreshNav();
            App.toast('¡Cuenta actualizada! 🐾');
        } else if (res.status === 401) {
            App.showLogin();
            App.toast('Tu sesión ha expirado.', 'error');
        } else if (res.status === 403) {
            errorDiv.textContent = '❌ No tienes permiso para editar esta cuenta.';
            errorDiv.classList.remove('hidden');
        } else {
            const data = await res.json().catch(() => null);
            errorDiv.textContent = '❌ ' + (data?.message || 'No se pudieron guardar los cambios.');
            errorDiv.classList.remove('hidden');
        }
    } catch (err) {
        errorDiv.textContent = '❌ Error al guardar los cambios.';
        errorDiv.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Guardar cambios';
    }
}

async function deactivateAccount() {
    if (!window.confirm('¿Seguro que quieres desactivar tu cuenta? No podrás volver a iniciar sesión con ella.')) return;
    try {
        const res = await fetch(`/api/v1/humans/${App.user.id}`, { method: 'DELETE' });
        if (res.ok || res.status === 204) {
            App.toast('Cuenta desactivada. ¡Hasta pronto! 🐱', 'info');
            await App.logout();
        } else if (res.status === 403) {
            App.toast('No tienes permiso para desactivar esta cuenta.', 'error');
        } else {
            const data = await res.json().catch(() => null);
            App.toast(data?.message || 'No se pudo desactivar la cuenta.', 'error');
        }
    } catch (err) {
        App.toast('Error al desactivar la cuenta.', 'error');
    }
}

loadAccount();
</script>
