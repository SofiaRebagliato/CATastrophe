<div class="fade-in max-w-3xl mx-auto">
    <div class="relative flex items-center justify-center mb-6">
        <h2 class="text-2xl font-bold text-gray-900 text-center">🧠 Personalidad y Humor</h2>
        <button onclick="App.showDashboard()" class="absolute right-0 text-sm text-gray-500 hover:text-cat-600">← Panel</button>
    </div>

    <!-- Personalidad -->
    <section class="mb-8">
        <h3 class="text-lg font-semibold text-gray-800 mb-3">🎭 Rasgos de personalidad</h3>
        <div id="personality-traits">
            <div class="text-center py-4 text-gray-400">Cargando personalidad...</div>
        </div>
    </section>

    <!-- Pronóstico de humor -->
    <section class="mb-8">
        <h3 class="text-lg font-semibold text-gray-800 mb-3">🌤️ Pronóstico de humor gatuno</h3>
        <div class="bg-white rounded-xl border border-gray-100 p-4">
            <p class="text-sm text-gray-500 mb-3">Obtén un pronóstico basado en la personalidad de tu gato, el clima y curiosidades felinas.</p>
            <button onclick="getMoodForecast()" class="text-sm bg-cat-600 text-white px-4 py-2 rounded-lg hover:bg-cat-700 transition">
                Consultar humor 🔮
            </button>
            <div id="mood-result" class="mt-4"></div>
        </div>
    </section>

    <!-- Cat Fact -->
    <section>
        <h3 class="text-lg font-semibold text-gray-800 mb-3">🐱 Curiosidad felina</h3>
        <div id="cat-fact" class="bg-white rounded-xl border border-gray-100 p-4">
            <button onclick="getRandomFact()" class="text-sm bg-gray-100 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-200">
                Obtener curiosidad 🎲
            </button>
            <p id="fact-text" class="text-sm text-gray-600 mt-3"></p>
        </div>
    </section>
</div>

<script>
var traitLabels = {
    PLAYFUL: '🎾 Juguetón',
    LAZY: '😴 Perezoso',
    HUNTER: '🐭 Cazador',
    SOCIAL: '🤝 Social',
    MYSTERIOUS: '🌙 Misterioso'
};

// El gato no guarda ubicación propia; usamos Valencia por defecto (no se muestra en el front).
var FORECAST_LAT = 39.47, FORECAST_LON = -0.37;

async function loadPersonality() {
    if (!App.activeCat) { document.getElementById('personality-traits').innerHTML = '<p class="text-sm text-gray-500">Activa un gato primero.</p>'; return; }
    const container = document.getElementById('personality-traits');
    try {
        const res = await fetch(`/api/v1/personalities/${App.activeCat.id}`);
        if (res.ok) {
            const data = await res.json();
            if (!data.scores || Object.keys(data.scores).length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-500">Tu gato aún no tiene datos de personalidad. ¡Interactúa para generarlos!</p>';
                return;
            }
            container.innerHTML = `
                <div class="bg-white rounded-xl border border-gray-100 p-4">
                    ${data.dominant ? `<p class="text-sm font-medium text-cat-700 mb-3">Rasgo dominante: ${traitLabels[data.dominant] || data.dominant}</p>` : ''}
                    <div class="space-y-3">
                        ${Object.entries(data.scores).map(([trait, score]) => `
                            <div>
                                <div class="flex justify-between text-xs text-gray-600 mb-1">
                                    <span>${traitLabels[trait] || trait}</span>
                                    <span>${(score * 100).toFixed(1)}%</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-2">
                                    <div class="bg-cat-500 h-2 rounded-full"
                                         style="width:0%; transition: width 0.8s ease-out;"
                                         data-target="${score * 100}"></div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    ${data.updatedAt ? `<p class="text-xs text-gray-400 mt-3">Actualizado: ${App.timeAgo(data.updatedAt)}</p>` : ''}
                </div>`;
        } else if (res.status === 404) {
            container.innerHTML = '<p class="text-sm text-gray-500">No hay datos de personalidad aún.</p>';
        }
    } catch (err) { container.innerHTML = '<p class="text-red-500 text-sm">Error al cargar personalidad.</p>'; }
    // Animate bars after DOM is painted
    requestAnimationFrame(function() {
        requestAnimationFrame(function() {
            document.querySelectorAll('[data-target]').forEach(function(el) {
                el.style.width = el.getAttribute('data-target') + '%';
            });
        });
    });
}

// Traduce la condición de OpenWeatherMap (en inglés) a emoji + etiqueta en español.
function weatherView(w) {
    if (!w) return null;
    var d = (w.condition || '').toLowerCase();
    var emoji = '🌤️', label = w.condition || 'Tiempo';
    if (d.indexOf('clear') >= 0)                                      { emoji = '☀️'; label = 'Cielo despejado'; }
    else if (d.indexOf('few') >= 0 || d.indexOf('scattered') >= 0)    { emoji = '⛅'; label = 'Parcialmente nublado'; }
    else if (d.indexOf('cloud') >= 0)                                 { emoji = '☁️'; label = 'Nublado'; }
    else if (d.indexOf('drizzle') >= 0)                               { emoji = '🌦️'; label = 'Llovizna'; }
    else if (d.indexOf('rain') >= 0)                                  { emoji = '🌧️'; label = 'Lluvia'; }
    else if (d.indexOf('thunder') >= 0 || d.indexOf('storm') >= 0)    { emoji = '⛈️'; label = 'Tormenta'; }
    else if (d.indexOf('snow') >= 0)                                  { emoji = '❄️'; label = 'Nieve'; }
    else if (d.indexOf('mist') >= 0 || d.indexOf('fog') >= 0
             || d.indexOf('haze') >= 0 || d.indexOf('smoke') >= 0)    { emoji = '🌫️'; label = 'Niebla'; }
    return { emoji: emoji, label: label, temp: w.tempCelsius, source: w.source };
}

// Indicador de origen del dato: en directo (API) vs caché (fallback del circuit breaker).
function sourceBadge(source) {
    if (source === 'CACHE') {
        return '<span class="text-xs px-2 py-1 rounded-full bg-yellow-100 text-yellow-700 font-medium whitespace-nowrap">⚠️ Datos en caché</span>';
    }
    return '<span class="text-xs px-2 py-1 rounded-full bg-green-100 text-green-700 font-medium whitespace-nowrap">● En directo</span>';
}

async function getMoodForecast() {
    if (!App.activeCat) { App.toast('Activa un gato primero.', 'error'); return; }
    const container = document.getElementById('mood-result');
    container.innerHTML = '<p class="text-sm text-gray-400">Consultando...</p>';

    try {
        const res = await fetch(`/api/v1/mood-forecast?catId=${App.activeCat.id}&lat=${FORECAST_LAT}&lon=${FORECAST_LON}`);
        if (res.ok) {
            const data = await res.json();
            const w = weatherView(data.weather);
            const weatherHtml = w
                ? `<div class="flex items-center justify-between bg-white rounded-lg p-3 mb-3 border border-cat-100">
                       <div class="flex items-center space-x-3">
                           <span class="text-4xl">${w.emoji}</span>
                           <div>
                               <p class="text-2xl font-bold text-gray-900 leading-none">${w.temp != null ? Math.round(w.temp) + '°C' : '—'}</p>
                               <p class="text-xs text-gray-500 mt-1">${w.label}</p>
                           </div>
                       </div>
                       ${sourceBadge(w.source)}
                   </div>`
                : `<div class="bg-white rounded-lg p-3 mb-3 border border-cat-100 text-sm text-gray-500">🌐 Clima no disponible ahora mismo (el resto del pronóstico sigue funcionando).</div>`;

            container.innerHTML = `
                <div class="bg-cat-50 border border-cat-200 rounded-lg p-4">
                    ${weatherHtml}
                    <p class="text-sm text-gray-800 font-medium mb-2">🔮 ${data.message || 'Sin mensaje'}</p>
                    <div class="grid grid-cols-1 gap-1 text-xs text-gray-600">
                        ${data.dominantTrait ? `<p>🎭 Rasgo: ${traitLabels[data.dominantTrait] || data.dominantTrait}</p>` : ''}
                        ${data.fact ? `<p>🐱 Dato: ${data.fact.text || ''}</p>` : ''}
                    </div>
                </div>`;
        } else {
            container.innerHTML = '<p class="text-sm text-red-500">No se pudo obtener el pronóstico.</p>';
        }
    } catch (err) { container.innerHTML = '<p class="text-sm text-red-500">Error de conexión.</p>'; }
}

async function getRandomFact() {
    try {
        const res = await fetch('/api/v1/cat-facts/random');
        if (res.ok) {
            const data = await res.json();
            document.getElementById('fact-text').textContent = data.text || 'Sin datos disponibles.';
        } else {
            document.getElementById('fact-text').textContent = 'No hay curiosidades disponibles ahora.';
        }
    } catch (err) { document.getElementById('fact-text').textContent = 'Error al obtener curiosidad.'; }
}

loadPersonality();
</script>
