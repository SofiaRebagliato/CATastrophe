<div class="fade-in">
    <!-- Header del dashboard -->
    <div class="flex justify-between items-center mb-6">
        <div>
            <h2 class="text-2xl font-bold text-gray-900">Panel de control 🐱</h2>
            <p class="text-gray-500 text-sm mt-1">Gestiona tus gatos y sus aventuras</p>
        </div>
        <button onclick="document.getElementById('add-cat-form').classList.remove('hidden')"
                class="bg-cat-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-cat-700 transition">
            + Nuevo gato
        </button>
    </div>

    <!-- Navegación rápida -->
    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-3 mb-8">
        <button onclick="App.showFeed()" class="bg-white rounded-xl border border-gray-100 p-3 text-center hover:shadow-md transition">
            <div class="text-2xl">📰</div><div class="text-xs text-gray-600 mt-1">Feed</div>
        </button>
        <button onclick="App.showMessages()" class="bg-white rounded-xl border border-gray-100 p-3 text-center hover:shadow-md transition">
            <div class="text-2xl">💬</div><div class="text-xs text-gray-600 mt-1">Mensajes</div>
        </button>
        <button onclick="App.showAdventures()" class="bg-white rounded-xl border border-gray-100 p-3 text-center hover:shadow-md transition">
            <div class="text-2xl">🗺️</div><div class="text-xs text-gray-600 mt-1">Aventuras</div>
        </button>
        <button onclick="App.showChallenges()" class="bg-white rounded-xl border border-gray-100 p-3 text-center hover:shadow-md transition">
            <div class="text-2xl">⚔️</div><div class="text-xs text-gray-600 mt-1">Retos</div>
        </button>
        <button onclick="App.showRankings()" class="bg-white rounded-xl border border-gray-100 p-3 text-center hover:shadow-md transition">
            <div class="text-2xl">🏆</div><div class="text-xs text-gray-600 mt-1">Rankings</div>
        </button>
        <button onclick="App.showBadges()" class="bg-white rounded-xl border border-gray-100 p-3 text-center hover:shadow-md transition">
            <div class="text-2xl">🎖️</div><div class="text-xs text-gray-600 mt-1">Insignias</div>
        </button>
        <button onclick="App.showPersonality()" class="bg-white rounded-xl border border-gray-100 p-3 text-center hover:shadow-md transition">
            <div class="text-2xl">🧠</div><div class="text-xs text-gray-600 mt-1">Personalidad</div>
        </button>
    </div>

    <!-- Formulario para añadir gato (oculto inicialmente) -->
    <div id="add-cat-form" class="hidden mb-10">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 max-w-lg">
            <h3 class="text-lg font-semibold text-gray-800 mb-4">🐱 Registrar nuevo gato</h3>
            <form id="cat-form" onsubmit="return handleAddCat(event)">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
                        <input type="text" id="cat-name" name="name" required
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cat-500 focus:border-cat-500 outline-none"
                               placeholder="Luna">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Raza</label>
                            <input type="text" id="cat-breed" name="breed"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cat-500 focus:border-cat-500 outline-none"
                                   placeholder="Siamés">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de nacimiento</label>
                            <input type="date" id="cat-birthdate" name="birthDate"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cat-500 focus:border-cat-500 outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Bio</label>
                        <textarea id="cat-bio" name="bio" rows="2"
                                  class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cat-500 focus:border-cat-500 outline-none"
                                  placeholder="Reina del sofá, amante del atún..."></textarea>
                    </div>
                </div>
                <div id="cat-error" class="hidden mt-3 p-3 bg-red-50 border border-red-200 rounded-lg text-sm text-red-700"></div>
                <div class="flex space-x-3 mt-4">
                    <button type="submit" id="cat-btn"
                            class="bg-cat-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-cat-700 transition">
                        Guardar 🐾
                    </button>
                    <button type="button" onclick="document.getElementById('add-cat-form').classList.add('hidden')"
                            class="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-200 transition">
                        Cancelar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Mis gatos -->
    <section class="mb-10">
        <h3 class="text-lg font-semibold text-gray-800 mb-4">🐾 Mis gatos</h3>
        <div id="my-cats">
            <div class="text-center py-8 text-gray-400">Cargando gatos... 🐱</div>
        </div>
    </section>
</div>

<script>
async function loadMyCats() {
    const container = document.getElementById('my-cats');
    try {
        const res = await fetch('/api/v1/cats/mine');
        if (res.ok) {
            const cats = await res.json();
            if (Array.isArray(cats) && cats.length > 0) {
                container.innerHTML = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">' +
                    cats.map(cat => `
                        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-5 hover:shadow-md transition cursor-pointer"
                             onclick="App.showCatProfile('${cat.id}')">
                            <div class="flex items-center justify-between mb-2">
                                <div class="flex items-center space-x-3">
                                    ${cat.avatarUrl ? `<img src="${cat.avatarUrl}" class="w-10 h-10 rounded-full object-cover" onerror="this.outerHTML='<span class=\\'text-2xl\\'>🐱</span>'">` : '<span class="text-2xl">🐱</span>'}
                                    <div>
                                        <h4 class="font-semibold text-gray-900">${cat.name} ${cat.isBirthday ? '🎂' : ''}</h4>
                                        <p class="text-xs text-gray-500">${cat.breed || 'Sin raza'} · ${cat.ageDisplay || ''}</p>
                                    </div>
                                </div>
                                <span class="text-xs bg-cat-100 text-cat-700 px-2 py-1 rounded-full font-medium">
                                    Lv.${cat.level || 0} · ${cat.xp || 0} XP
                                </span>
                            </div>
                            ${cat.bio ? `<p class="text-sm text-gray-600 mt-2">${cat.bio}</p>` : ''}
                            <div class="mt-3 flex space-x-2">
                                <button onclick="event.stopPropagation(); App.setActiveCat(${JSON.stringify(cat).replace(/"/g, '&quot;')})"
                                        class="text-xs ${App.activeCat && App.activeCat.id === cat.id ? 'bg-cat-600 text-white' : 'bg-gray-100 text-gray-600'} px-2 py-1 rounded hover:bg-cat-200 transition">
                                    ${App.activeCat && App.activeCat.id === cat.id ? '✓ Activo' : 'Activar'}
                                </button>
                            </div>
                        </div>
                    `).join('') + '</div>';
            } else {
                container.innerHTML = `
                    <div class="text-center py-8 bg-white rounded-xl border border-dashed border-gray-300">
                        <p class="text-gray-500">Aún no tienes gatos registrados</p>
                        <button onclick="document.getElementById('add-cat-form').classList.remove('hidden')"
                                class="text-cat-600 font-medium text-sm mt-2 hover:text-cat-700">
                            + Registrar mi primer gato
                        </button>
                    </div>`;
            }
        } else if (res.status === 401) {
            App.showLogin();
            App.toast('Tu sesión ha expirado.', 'error');
        }
    } catch (err) {
        container.innerHTML = '<p class="text-center py-8 text-red-500">Error al cargar los gatos.</p>';
    }
}

async function handleAddCat(e) {
    e.preventDefault();
    const btn = document.getElementById('cat-btn');
    const errorDiv = document.getElementById('cat-error');
    errorDiv.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = 'Guardando... ⏳';

    try {
        const body = { name: document.getElementById('cat-name').value };
        const breed = document.getElementById('cat-breed').value;
        const birthDate = document.getElementById('cat-birthdate').value;
        const bio = document.getElementById('cat-bio').value;
        if (breed) body.breed = breed;
        if (birthDate) body.birthDate = birthDate;
        if (bio) body.bio = bio;

        const res = await fetch('/api/v1/cats', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (res.ok || res.status === 201) {
            document.getElementById('add-cat-form').classList.add('hidden');
            document.getElementById('cat-form').reset();
            App.toast('¡Gato registrado! 🎉');
            await App.loadActiveCat();
            App.refreshNav();
            loadMyCats();
        } else if (res.status === 401) {
            App.showLogin();
            App.toast('Tu sesión ha expirado.', 'error');
        } else {
            const data = await res.json().catch(() => null);
            errorDiv.textContent = '❌ ' + (data?.message || 'No se pudo registrar el gato.');
            errorDiv.classList.remove('hidden');
        }
    } catch (err) {
        errorDiv.textContent = '❌ Error de conexión.';
        errorDiv.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Guardar 🐾';
    }
}

loadMyCats();
</script>
