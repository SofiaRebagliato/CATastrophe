<div class="fade-in max-w-2xl mx-auto">
    <div class="relative flex items-center justify-center mb-6">
        <h2 class="text-2xl font-bold text-gray-900 text-center">💬 Mensajes</h2>
        <button onclick="App.showDashboard()" class="absolute right-0 text-sm text-gray-500 hover:text-cat-600">← Panel</button>
    </div>

    <div id="messages-inbox">
        <div class="text-center py-8 text-gray-400">Cargando mensajes...</div>
    </div>
</div>

<script>
async function loadInbox() {
    if (!App.requireCat()) return;
    const container = document.getElementById('messages-inbox');
    try {
        const res = await fetch('/api/v1/messages/inbox', { headers: App.getCatHeaders() });
        if (res.ok) {
            const messages = await res.json();
            if (messages.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-gray-500">No hay mensajes. ¡Envía un mensaje a otro gato!</div>';
                return;
            }
            // Agrupar por conversación (último mensaje por gato)
            const conversations = {};
            messages.forEach(m => {
                const otherId = m.senderId === App.activeCat.id ? m.receiverId : m.senderId;
                if (!conversations[otherId] || new Date(m.createdAt) > new Date(conversations[otherId].createdAt)) {
                    conversations[otherId] = m;
                }
            });

            // Resolver nombres de gatos
            await App.resolveCatNames(Object.keys(conversations));

            container.innerHTML = Object.entries(conversations).map(([catId, msg]) => {
                const catName = App.getCatDisplayName(catId);
                const catAvatar = App.getCatAvatar(catId);
                return `
                <div class="bg-white rounded-xl border border-gray-100 p-4 mb-3 cursor-pointer hover:shadow-md transition"
                     onclick="App.showConversation('${catId}')">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center space-x-2">
                            ${catAvatar ? `<img src="${catAvatar}" class="w-8 h-8 rounded-full object-cover" onerror="this.outerHTML='<span class=\\'text-lg\\'>🐱</span>'">` : '<span class="text-lg">🐱</span>'}
                            <span class="font-medium text-gray-800 text-sm">${catName}</span>
                            ${!msg.read && msg.receiverId === App.activeCat.id ? '<span class="w-2 h-2 bg-cat-500 rounded-full"></span>' : ''}
                        </div>
                        <span class="text-xs text-gray-400">${App.timeAgo(msg.createdAt)}</span>
                    </div>
                    <p class="text-sm text-gray-600 mt-1 truncate">${msg.content}</p>
                </div>`;
            }).join('');
        }
    } catch (err) {
        container.innerHTML = '<p class="text-red-500 text-center">Error al cargar mensajes.</p>';
    }
}

loadInbox();
</script>
