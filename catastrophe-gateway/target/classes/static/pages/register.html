<div class="max-w-md mx-auto fade-in">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
        <div class="text-center mb-6">
            <span class="text-5xl">🐾</span>
            <h2 class="text-2xl font-bold text-gray-900 mt-3">Crear cuenta</h2>
            <p class="text-gray-500 text-sm mt-1">Únete como asistente oficial de gatos</p>
        </div>

        <form hx-post="/api/v1/auth/register"
              hx-ext="json-enc"
              hx-target="#register-result"
              hx-swap="innerHTML"
              hx-on::after-request="if(event.detail.successful) document.body.dispatchEvent(new Event('registerSuccess'))">

            <div class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                    <input type="text" id="username" name="username" required minlength="3" maxlength="50"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cat-500 focus:border-cat-500 outline-none transition"
                           placeholder="gatero99">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" id="email" name="email" required
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cat-500 focus:border-cat-500 outline-none transition"
                           placeholder="gatero@mail.com">
                </div>
                <div>
                    <label for="displayName" class="block text-sm font-medium text-gray-700 mb-1">Nombre público</label>
                    <input type="text" id="displayName" name="displayName" required
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cat-500 focus:border-cat-500 outline-none transition"
                           placeholder="El Gatero Supremo">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                    <input type="password" id="password" name="password" required minlength="6"
                           class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-cat-500 focus:border-cat-500 outline-none transition"
                           placeholder="••••••••">
                </div>
            </div>

            <button type="submit"
                    class="w-full mt-6 bg-cat-600 text-white py-2.5 rounded-lg font-medium hover:bg-cat-700 transition">
                <span class="htmx-indicator">⏳</span>
                Registrarse 🐱
            </button>
        </form>

        <div id="register-result" class="mt-4"></div>

        <p class="text-center text-sm text-gray-500 mt-6">
            ¿Ya tienes cuenta?
            <a href="#" onclick="App.showLogin()" class="text-cat-600 hover:text-cat-700 font-medium">Inicia sesión</a>
        </p>
    </div>
</div>
