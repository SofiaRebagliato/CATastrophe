<div class="fade-in max-w-4xl mx-auto">
    <div class="flex items-center mb-6">
        <button onclick="App.showDashboard()" class="text-sm text-gray-500 hover:text-cat-600">← Panel</button>
        <h2 class="text-2xl font-bold text-gray-900 mx-auto pr-20">⚔️ Retos PvP</h2>
    </div>

    <!-- Mis retos -->
    <section class="mb-8">
        <h3 class="text-lg font-semibold text-gray-800 mb-3">🎮 Mis retos</h3>
        <div id="my-challenges">
            <div class="text-center py-4 text-gray-400">Cargando...</div>
        </div>
    </section>

    <!-- Retos disponibles para crear -->
    <section class="mb-8">
        <h3 class="text-lg font-semibold text-gray-800 mb-3">📋 Catálogo de retos</h3>
        <div id="challenge-catalog">
            <div class="text-center py-4 text-gray-400">Cargando...</div>
        </div>
    </section>

    <!-- Retos pendientes de aceptar -->
    <section>
        <h3 class="text-lg font-semibold text-gray-800 mb-3">⏳ Retos pendientes</h3>
        <div id="pending-challenges">
            <div class="text-center py-4 text-gray-400">Cargando...</div>
        </div>
    </section>
</div>

<script>
var _challengeCatalog = null;
async function getChallengeCatalog() {
    if (_challengeCatalog) return _challengeCatalog;
    var res = await fetch('/api/v1/challenges');
    _challengeCatalog = res.ok ? await res.json() : [];
    return _challengeCatalog;
}

var _challengeStatusLabels = {
    PENDING:  { text: '⏳ Pendiente',  cls: 'bg-yellow-100 text-yellow-700' },
    ACTIVE:   { text: '⚔️ En juego',   cls: 'bg-blue-100 text-blue-700'    },
    WON:      { text: '🏆 Ganado',     cls: 'bg-green-100 text-green-700'  },
    LOST:     { text: '😿 Perdido',    cls: 'bg-red-100 text-red-700'      },
    RESOLVED: { text: '✅ Resuelto',   cls: 'bg-gray-100 text-gray-600'    }
};
function challengeStatusTag(status) {
    var s = _challengeStatusLabels[status] || { text: status, cls: 'bg-gray-100 text-gray-600' };
    return `<span class="text-xs px-2 py-0.5 rounded ${s.cls}">${s.text}</span>`;
}

async function loadMyChallenges() {
    if (!App.activeCat) return;
    var container = document.getElementById('my-challenges');
    var catalog = await getChallengeCatalog();
    var catMap = {};
    catalog.forEach(function(c) { catMap[c.id] = c; });
    try {
        var res = await fetch('/api/v1/challenges/my', { headers: App.getCatHeaders() });
        if (res.ok) {
            var challenges = await res.json();
            if (challenges.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-500">No has participado en retos aún.</p>';
                return;
            }
            container.innerHTML = '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">' + challenges.map(function(c) {
                var title = (catMap[c.challengeId] || {}).title || 'Reto';
                var isActive = c.status === 'ACTIVE';
                return `<div class="bg-white rounded-xl border border-gray-100 p-4">
                    <div class="flex justify-between items-center">
                        <span class="font-medium text-sm text-gray-800">${title}</span>
                        ${challengeStatusTag(c.status)}
                    </div>
                    ${c.score !== null && c.score !== undefined && c.score > 0 ? `<p class="text-xs text-gray-500 mt-1">Puntuación: ${c.score}</p>` : ''}
                    ${isActive ? `<div class="mt-2 p-2 bg-blue-50 rounded text-xs text-blue-700">
                        💡 El reto se resuelve automáticamente al completar la aventura asociada.
                    </div>` : ''}
                </div>`;
            }).join('') + '</div>';
        }
    } catch (err) { container.innerHTML = '<p class="text-red-500 text-sm">Error.</p>'; }
}

async function loadChallengeCatalog() {
    var container = document.getElementById('challenge-catalog');
    try {
        var catalog = await getChallengeCatalog();
        if (catalog.length === 0) {
            container.innerHTML = '<p class="text-sm text-gray-500">No hay retos disponibles.</p>';
            return;
        }
        container.innerHTML = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">' + catalog.map(function(c) {
            return `<div class="bg-white rounded-xl border border-gray-100 p-4">
                <h4 class="font-semibold text-sm text-gray-800">${c.title}</h4>
                <p class="text-xs text-gray-500 mt-1">${c.description || ''}</p>
                <div class="flex justify-between items-center mt-3">
                    <span class="text-xs text-gray-500">🎯 ${c.xpReward} XP · ${c.challengeType || ''}</span>
                    <button onclick="createChallenge('${c.id}')" class="text-xs bg-cat-600 text-white px-3 py-1 rounded-lg hover:bg-cat-700">Crear reto</button>
                </div>
            </div>`;
        }).join('') + '</div>';
    } catch (err) { container.innerHTML = '<p class="text-red-500 text-sm">Error.</p>'; }
}

async function loadPendingChallenges() {
    if (!App.activeCat) return;
    var container = document.getElementById('pending-challenges');
    // Load pending challenges from all challenge types
    try {
        var catalog = await getChallengeCatalog();
        var allPending = [];
        await Promise.all(catalog.map(async function(c) {
            var res = await fetch(`/api/v1/challenges/${c.id}/pending`);
            if (res.ok) {
                var items = await res.json();
                // Filter out our own and add challenge title
                items.forEach(function(item) {
                    if (item.catId !== App.activeCat.id) {
                        item._title = c.title;
                        allPending.push(item);
                    }
                });
            }
        }));
        if (allPending.length === 0) {
            container.innerHTML = '<p class="text-sm text-gray-500">No hay retos esperando oponente.</p>';
            return;
        }
        container.innerHTML = '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">' + allPending.map(function(c) {
            return `<div class="bg-white rounded-xl border border-gray-100 p-4 flex justify-between items-center">
                <div>
                    <p class="font-medium text-sm text-gray-800">${c._title}</p>
                    <p class="text-xs text-gray-400">Esperando que aceptes</p>
                </div>
                <button onclick="acceptChallenge('${c.id}')" class="text-xs bg-cat-600 text-white px-3 py-1 rounded-lg hover:bg-cat-700">Aceptar ⚔️</button>
            </div>`;
        }).join('') + '</div>';
    } catch (err) {
        container.innerHTML = '<p class="text-sm text-gray-500">No se pudieron cargar los retos pendientes.</p>';
    }
}

async function createChallenge(challengeId) {
    if (!App.requireCat()) return;
    try {
        var res = await fetch('/api/v1/challenges/create', {
            method: 'POST', headers: App.getHeaders(),
            body: JSON.stringify({ challengeId })
        });
        if (res.ok || res.status === 201) {
            App.toast('¡Reto creado! Esperando oponente... ⚔️');
            loadMyChallenges();
            loadPendingChallenges();
        } else { App.toast('No se pudo crear el reto.', 'error'); }
    } catch (err) { App.toast('Error.', 'error'); }
}

async function acceptChallenge(catChallengeId) {
    if (!App.requireCat()) return;
    try {
        var res = await fetch(`/api/v1/challenges/${catChallengeId}/accept`, {
            method: 'POST', headers: App.getCatHeaders()
        });
        if (res.ok) { App.toast('¡Reto aceptado! ⚔️'); loadMyChallenges(); loadPendingChallenges(); }
    } catch (err) { App.toast('Error.', 'error'); }
}

loadMyChallenges();
loadChallengeCatalog();
loadPendingChallenges();
</script>

                    </div>

                </div>
            `).join('') + '</div>';
        }
    } catch (err) { container.innerHTML = '<p class="text-red-500 text-sm">Error.</p>'; }
}

async function loadChallengeCatalog() {
    const container = document.getElementById('challenge-catalog');
    try {
        const res = await fetch('/api/v1/challenges');
        if (res.ok) {
            const challenges = await res.json();
            if (challenges.length === 0) { container.innerHTML = '<p class="text-sm text-gray-500">No hay retos disponibles.</p>'; return; }
            container.innerHTML = '<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">' + challenges.map(c => `

                    <p class="text-xs text-gray-500 mt-1">${c.description || ''}</p>

                        <button onclick="createChallenge('${c.id}')" class="text-xs bg-cat-600 text-white px-3 py-1 rounded-lg hover:bg-cat-700">Crear reto</button>
                    </div>
                </div>
            `).join('') + '</div>';
        }
    } catch (err) { container.innerHTML = '<p class="text-red-500 text-sm">Error.</p>'; }
}

async function loadPendingChallenges() {
    const container = document.getElementById('pending-challenges');
    // We need a challengeId to check pending; skip if no catalog loaded
    container.innerHTML = '<p class="text-sm text-gray-500">Selecciona un reto del catálogo para ver pendientes.</p>';
}

async function createChallenge(challengeId) {
    if (!App.requireCat()) return;
    try {
        const res = await fetch('/api/v1/challenges/create', {
            method: 'POST', headers: App.getHeaders(),
            body: JSON.stringify({ challengeId })
        });
        if (res.ok || res.status === 201) {
            App.toast('¡Reto creado! Esperando oponente... ⚔️');
            loadMyChallenges();
        } else { App.toast('No se pudo crear el reto.', 'error'); }

}

async function acceptChallenge(catChallengeId) {
    if (!App.requireCat()) return;
    try {
        const res = await fetch(`/api/v1/challenges/${catChallengeId}/accept`, {
            method: 'POST', headers: App.getCatHeaders()
        });
        if (res.ok) { App.toast('¡Reto aceptado! ⚔️'); loadMyChallenges(); }
    } catch (err) { App.toast('Error.', 'error'); }
}

loadMyChallenges();
loadChallengeCatalog();
loadPendingChallenges();
</script>
