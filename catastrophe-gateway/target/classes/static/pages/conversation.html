<div class="fade-in max-w-2xl mx-auto">
    <div class="flex justify-between items-center mb-4">
        <button onclick="App.showMessages()" class="text-sm text-gray-500 hover:text-cat-600">← Mensajes</button>
        <span id="conv-header" class="text-sm font-medium text-gray-700"></span>
    </div>

    <div id="conv-messages" class="bg-white rounded-xl border border-gray-100 p-4 mb-4 max-h-96 overflow-y-auto space-y-3">
        <div class="text-center py-4 text-gray-400">Cargando...</div>
    </div>

    <form id="msg-form" onsubmit="return sendMessage(event)" class="flex space-x-2">
        <input type="text" id="msg-input" required placeholder="Escribe un mensaje..."
               class="flex-1 px-4 py-2 border border-gray-200 rounded-lg outline-none focus:ring-2 focus:ring-cat-500">
        <button type="submit" class="bg-cat-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-cat-700 transition">
            Enviar 🐾
        </button>
    </form>
</div>

<script>
const _otherCatId = window._conversationCatId;

async function loadConversation() {
    if (!App.requireCat() || !_otherCatId) return;
    document.getElementById('conv-header').textContent = `Conversación con ${_otherCatId.substring(0, 8)}...`;

    // Mark as read
    fetch(`/api/v1/messages/read/${_otherCatId}`, { method: 'PUT', headers: App.getCatHeaders() });

    const container = document.getElementById('conv-messages');
    try {
        const res = await fetch(`/api/v1/messages/with/${_otherCatId}?page=0&size=50`, { headers: App.getCatHeaders() });
        if (res.ok) {
            const messages = await res.json();
            if (messages.length === 0) {
                container.innerHTML = '<div class="text-center py-4 text-gray-500 text-sm">Sin mensajes aún. ¡Di hola!</div>';
                return;
            }
            container.innerHTML = messages.map(m => {
                const isMine = m.senderId === App.activeCat.id;
                return `
                    <div class="flex ${isMine ? 'justify-end' : 'justify-start'}">
                        <div class="max-w-xs px-3 py-2 rounded-xl text-sm ${isMine ? 'bg-cat-100 text-cat-800' : 'bg-gray-100 text-gray-800'}">
                            <p>${m.content}</p>
                            <span class="text-xs text-gray-400 mt-1 block">${App.timeAgo(m.createdAt)}</span>
                        </div>
                    </div>`;
            }).join('');
            container.scrollTop = container.scrollHeight;
        }
    } catch (err) {
        container.innerHTML = '<p class="text-red-500 text-sm text-center">Error al cargar la conversación.</p>';
    }
}

async function sendMessage(e) {
    e.preventDefault();
    const input = document.getElementById('msg-input');
    try {
        const res = await fetch('/api/v1/messages', {
            method: 'POST',
            headers: App.getHeaders(),
            body: JSON.stringify({ receiverId: _otherCatId, content: input.value })
        });
        if (res.ok || res.status === 201) {
            input.value = '';
            loadConversation();
        } else {
            App.toast('No se pudo enviar el mensaje.', 'error');
        }
    } catch (err) { App.toast('Error de conexión.', 'error'); }
}

loadConversation();
</script>
