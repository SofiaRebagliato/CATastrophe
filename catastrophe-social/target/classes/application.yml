server:
  port: 8082

spring:
  application:
    name: catastrophe-social

  # ── PostgreSQL ──
  datasource:
    url: jdbc:postgresql://localhost:5432/catastrophe_social
    username: catastrophe
    password: catastrophe_dev
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # Flyway gestiona el esquema
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ── Flyway ──
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ── Redis ──
  data:
    redis:
      host: localhost
      port: 6379

  # ── Kafka ──
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: catastrophe-social
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.catastrophe.commons.event
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: >
          catastropheEvent:com.catastrophe.commons.event.CatastropheEvent

  # ── Virtual Threads (Java 21) ──
  threads:
    virtual:
      enabled: true

# ── Actuator ──
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

# ── Logging ──
logging:
  level:
    com.catastrophe.social: DEBUG
    org.hibernate.SQL: DEBUG
