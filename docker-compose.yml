version: '3.9'

# ════════════════════════════════════════════════════════════
#  CATastrophe — Infraestructura de desarrollo
#  Ejecutar: docker compose up -d
# ════════════════════════════════════════════════════════════

services:

  # ── PostgreSQL ──
  # Cada microservicio tiene su propia base de datos (database-per-service)
  postgres:
    image: postgres:16-alpine
    container_name: catastrophe-postgres
    environment:
      POSTGRES_USER: catastrophe
      POSTGRES_PASSWORD: catastrophe_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catastrophe"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──
  # Sesiones, caché de APIs externas, rankings (Sorted Sets)
  redis:
    image: redis:7-alpine
    container_name: catastrophe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Zookeeper (requerido por Kafka) ──
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: catastrophe-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ── Apache Kafka ──
  # Bus de eventos entre microservicios
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: catastrophe-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ── Kafka UI (opcional, muy útil para debug) ──
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: catastrophe-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: catastrophe
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

volumes:
  postgres_data:
  redis_data:
